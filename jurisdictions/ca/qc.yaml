code: CA-QC
name: {en: Québec, fr: Québec}
rows:
  - id: STY-010
    text: {en: "The palettes of the design system are mandatory. Text is dark blue on white, violet is kept for visited links, and color always comes with a text equivalent. The page cites WCAG 2.1 level AA for contrast.", fr: "Les palettes du système de design sont obligatoires. Le texte est bleu foncé sur blanc, le violet est réservé aux liens visités et la couleur est toujours accompagnée d’un équivalent textuel. La page cite le niveau AA des WCAG 2.1 pour le contraste."}
    status: stricter
    source: {title: "Système de design gouvernemental, Couleurs", date: "2023-06-12", url: "https://design.quebec.ca/design/bases/couleurs", archive: "https://web.archive.org/web/20260626095517/https://design.quebec.ca/design/bases/couleurs"}
    last_checked: "2026-11-05"
  - id: STY-011
    text: {en: "The fonts are mandatory: Roboto for headings and the header banner, and Open Sans for body text. The Chaloult typeface is for signage and print, not for websites.", fr: "Les polices sont obligatoires : Roboto pour les titres et le bandeau d’en-tête, et Open Sans pour le corps du texte. La police Chaloult sert à la signalisation et à l’imprimé, pas aux sites Web."}
    status: stricter
    source: {title: "Système de design gouvernemental, Polices de caractères", date: "2026-10-13", url: "https://design.quebec.ca/design/bases/polices-caracteres", archive: "https://web.archive.org/web/20260626095505/https://design.quebec.ca/design/bases/polices-caracteres"}
    last_checked: "2026-11-05"
  - id: STY-012
    text: {en: "Spacing, alignment and sizes follow an 8-pixel grid, with a 4-pixel half step for icons and text. Line heights are multiples of 8 pixels.", fr: "L’espacement, l’alignement et les dimensions suivent une grille de 8 pixels, avec un demi-pas de 4 pixels pour les icônes et le texte. Les hauteurs de ligne sont des multiples de 8 pixels."}
    status: stricter
    source: {title: "Système de design gouvernemental, Grille 8 px", date: "2026-10-20", url: "https://design.quebec.ca/design/bases/grille-8px", archive: "https://web.archive.org/web/20260626095517/https://design.quebec.ca/design/bases/grille-8px"}
    last_checked: "2026-11-05"
  - id: STY-014
    text: {en: "Five shadow levels, from 0 for flat content to 4 for modal dialogs, each tied to how interactive the element is. Shadows are never used for style alone.", fr: "Cinq niveaux d’ombre, de 0 pour le contenu à plat à 4 pour les boîtes de dialogue modales, chacun lié au degré d’interactivité de l’élément. Les ombres ne servent jamais uniquement au style."}
    status: same
    source: {title: "Système de design gouvernemental, Ombrages", date: "2026-10-13", url: "https://design.quebec.ca/design/bases/ombrages", archive: "https://web.archive.org/web/20260626095517/https://design.quebec.ca/design/bases/ombrages"}
    last_checked: "2026-11-05"
  - id: STY-021
    text: {en: "Focus looks like hover with an added outline, often 2 pixels and blue, on every interactive component. Only one element has focus at a time.", fr: "Le focus ressemble au survol avec un contour en plus, souvent bleu et de 2 pixels, sur chaque composant interactif. Un seul élément a le focus à la fois."}
    status: same
    source: {title: "Système de design gouvernemental, États", date: "2026-10-13", url: "https://design.quebec.ca/design/bases/etats", archive: "https://web.archive.org/web/20260626095517/https://design.quebec.ca/design/bases/etats"}
    last_checked: "2026-11-05"
  - id: STY-024
    text: {en: "Avoid disabled buttons in most cases, because they do not say what the person must do. Keep the button active and show a clear error message instead.", fr: "Évitez les boutons inactifs dans la plupart des cas, car ils ne disent pas ce que la personne doit faire. Gardez plutôt le bouton actif et affichez un message d’erreur clair."}
    status: same
    source: {title: "Système de design gouvernemental, Boutons", date: "2026-10-13", url: "https://design.quebec.ca/design/composants/boutons", archive: "https://web.archive.org/web/20250804161831/https://design.quebec.ca/design/composants/boutons"}
    last_checked: "2026-11-05"
  - id: STY-030
    text: {en: "Ideally, a field is checked when the person leaves it, never during typing. A check on submit is allowed, but it makes the person fix every error at once.", fr: "Idéalement, un champ est vérifié quand la personne le quitte, jamais pendant la saisie. Une vérification à l’envoi est permise, mais elle oblige la personne à corriger toutes les erreurs à la fois."}
    status: same
    source: {title: "Système de design gouvernemental, Gestion des erreurs", date: "2024-06-05", url: "https://design.quebec.ca/design/bases/gestion-erreurs", archive: "https://web.archive.org/web/20260626095533/https://design.quebec.ca/design/bases/gestion-erreurs"}
    last_checked: "2026-11-05"
  - id: STY-031
    text: {en: "The field message goes below the field. The error shows both visually and in text, and names the exact problem and its fix.", fr: "Le message du champ se place sous le champ. L’erreur s’affiche à la fois visuellement et par du texte, et nomme le problème précis et sa correction."}
    status: same
    source: {title: "Système de design gouvernemental, Message d'erreur", date: "2026-10-14", url: "https://design.quebec.ca/design/composants/formulaire/message-erreur", archive: "https://web.archive.org/web/20261103004302/https://design.quebec.ca/design/composants/formulaire/message-erreur"}
    last_checked: "2026-11-05"
  - id: STY-032
    text: {en: "An error summary is optional. When present, it lists every error of the form as links and adds to the field messages.", fr: "Le sommaire des erreurs est facultatif. S’il est présent, il énumère toutes les erreurs du formulaire sous forme de liens et s’ajoute aux messages des champs."}
    status: looser
    source: {title: "Système de design gouvernemental, Gestion des erreurs", date: "2024-06-05", url: "https://design.quebec.ca/design/bases/gestion-erreurs", archive: "https://web.archive.org/web/20260626095533/https://design.quebec.ca/design/bases/gestion-erreurs"}
    last_checked: "2026-11-05"
  - id: STY-041
    text: {en: "A warning button marks a destructive or irreversible action, such as a deletion. A confirmation step, often a modal dialog, is added when possible.", fr: "Un bouton d’avertissement signale une action destructrice ou irréversible, comme une suppression. Une étape de confirmation, souvent une boîte de dialogue modale, est ajoutée quand c’est possible."}
    status: looser
    source: {title: "Système de design gouvernemental, Boutons", date: "2026-10-13", url: "https://design.quebec.ca/design/composants/boutons", archive: "https://web.archive.org/web/20250804161831/https://design.quebec.ca/design/composants/boutons"}
    last_checked: "2026-11-05"
  - id: STY-052
    text: {en: "The PIV header banner is mandatory on public sites and extranets. The government signature always appears and no other logo may replace it. The body supplies its site name.", fr: "Le bandeau d’en-tête PIV est obligatoire sur les sites publics et les extranets. La signature gouvernementale y figure toujours et aucun autre logo ne peut la remplacer. L’organisme fournit le nom de son site."}
    status: same
    source: {title: "Système de design gouvernemental, Bandeau d'en-tête PIV", date: "2026-10-14", url: "https://design.quebec.ca/design/modeles/bandeau-en-tete-piv", archive: "https://web.archive.org/web/20260626095533/https://design.quebec.ca/design/modeles/bandeau-en-tete-piv"}
    last_checked: "2026-11-05"
  - id: STY-056
    text: {en: "Strict application of the design system is mandatory for ministries and agencies and their partners. The rule is binding, so a product records any behavior of the design system that differs from a STY rule, as STY-056 asks.", fr: "L’application stricte du système de design est obligatoire pour les ministères et organismes et leurs partenaires. La règle est obligatoire : un produit consigne donc tout comportement du système de design qui diffère d’une règle STY, comme le demande STY-056."}
    status: same
    source: {title: "À propos du Système de design gouvernemental", date: "2026-10-13", url: "https://design.quebec.ca/a-propos/systeme-design", archive: "https://web.archive.org/web/20261103004635/https://design.quebec.ca/a-propos/systeme-design"}
    last_checked: "2026-11-05"
